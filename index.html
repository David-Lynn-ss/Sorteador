<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Sorteio Lynn</title>
</head>

<body>
    <img src="./assets/sort 1.png" alt="logo-sorteio" class="logo">

    <h2>Sortear um Número</h2>
    <div class="container">
        <input type="number" min="0" id="min" placeholder="Número Mínimo">
        <input type="number" min="0" id="max" placeholder="Número Máximo">

    </div>
    <div id="resultado"></div>
    <button id="sortear">Sortear</button>
</body>
<script src="script.js"></script>

</html>
